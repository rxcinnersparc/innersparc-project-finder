<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Inner SPARC Project Finder</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D6FTCL8C4N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-D6FTCL8C4N');

    <!-- Favicon for browser tab -->
    <link rel="icon" type="image/png" href="/projectfinder.png">
    <link rel="shortcut icon" type="image/png" href="/projectfinder.png">
    
    <!-- For Apple devices -->
    <link rel="apple-touch-icon" href="/projectfinder.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f5fb;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Minimal loading spinner */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f4f5fb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        
        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #dde0f0;
            border-top-color: #222689;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #gas-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Error message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 1px solid #f5c2c2;
            display: none;
            z-index: 10001;
        }
        
        .error-message.show {
            display: block;
        }

        /* Close (x) button */
        .close-button {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            font-weight: bold;
            color: #7b7fa8;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 50%;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .close-button:hover {
            color: #333;
            background: #f0f1f7;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error-title {
            font-size: 1rem;
            font-weight: 800;
            color: #c0392b;
            margin-bottom: 8px;
        }
        
        .error-text {
            font-size: 0.75rem;
            color: #7b7fa8;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .error-button {
            background: #222689;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
        }
        
        .error-button:hover {
            background: #1a1d6e;
        }
    </style>
</head>
<body>    
    <!-- Minimal loading spinner -->
    <div class="loading-container" id="loadingContainer">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="error-message" id="errorMessage">
        <button class="close-button" id="closeErrorModal" aria-label="Close error modal">&times;</button>
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-text" id="errorText">
            Unable to load the application. Please check your internet connection and try again.
        </div>
        <button class="error-button" onclick="location.reload()">Retry</button>
    </div>
    
    <iframe id="gas-iframe" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe>

    <script>
        // ⚠️ IMPORTANT: Replace this with your actual Google Apps Script Web App URL
        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzAOnAB1ZKUQ2YJ8vHjl0pM5sYG_XHXg6ZCHpMNinGRbGRaKARzmbhVU-bXzLQGOcL2iw/exec';
        
        // ------------------------------------------------------------
        // ROUTE TABLES
        // ------------------------------------------------------------
        const PROJECT_PREFIX = 'project';   // /project/<slug>
        const COMPARE_PREFIX = 'compare';   // /compare/<slug-a>-vs-<slug-b>

        const iframe = document.getElementById('gas-iframe');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loadingContainer = document.getElementById('loadingContainer');
        const closeErrorModal = document.getElementById('closeErrorModal');

        let hasLoaded = false;
        let loadTimeout;

        // ------------------------------------------------------------
        // PATH ⇄ PAGE TRANSLATORS
        // ------------------------------------------------------------
        function pathnameToPage(pathname) {
            var p = (pathname || '/').replace(/^\/+|\/+$/g, '').toLowerCase();
            if (!p) return 'home';
            
            if (p === 'admin') return 'admin';

            var parts = p.split('/');
            if (parts.length >= 2) {
                if (parts[0] === PROJECT_PREFIX) {
                    return 'project-' + parts[1];
                }
                if (parts[0] === COMPARE_PREFIX) {
                    return 'compare-' + parts[1];
                }
            }

            return 'home';
        }

        function pageToPathname(page) {
            var p = (page || '').toString().trim().toLowerCase();
            if (!p || p === 'home') return '/';
            
            if (p === 'admin') return '/admin';

            if (p.indexOf('project-') === 0) {
                var projSlug = p.slice('project-'.length);
                if (projSlug) return '/' + PROJECT_PREFIX + '/' + projSlug;
                return '/';
            }

            if (p.indexOf('compare-') === 0) {
                var cmpSlug = p.slice('compare-'.length);
                if (cmpSlug) return '/' + COMPARE_PREFIX + '/' + cmpSlug;
                return '/';
            }

            return '/';
        }

        // ------------------------------------------------------------
        // IFRAME SRC BUILDER
        // ------------------------------------------------------------
        function buildIframeUrl() {
            var page = pathnameToPage(window.location.pathname);
            var url = new URL(GAS_WEBAPP_URL);
            
            // Special handling for /admin route
            if (page === 'admin') {
                // Check if admin session exists in localStorage
                var hasAdminSession = false;
                try {
                    var adminSession = localStorage.getItem('sparc_admin_session');
                    if (adminSession) {
                        var parsed = JSON.parse(adminSession);
                        // Check if the session is still valid (optional: add expiration check here)
                        if (parsed && parsed.isAdmin) {
                            hasAdminSession = true;
                        }
                    }
                } catch (e) {
                    console.warn('Could not read admin session:', e);
                }

                if (hasAdminSession) {
                    url.searchParams.set('page', 'admin');
                }
                // If no session, don't pass 'page=admin' -> defaults to normal Index.html
                
            } else if (page && page !== 'home') {
                url.searchParams.set('page', page);
            }
            
            return url.toString();
        }
            
            var page = pathnameToPage(window.location.pathname);
            var url = new URL(GAS_WEBAPP_URL);
            if (page && page !== 'home') url.searchParams.set('page', page);
            return url.toString();
        }

        // ------------------------------------------------------------
        // LEGACY REDIRECT: ?page=… → /project/… etc.
        // ------------------------------------------------------------
        (function migrateLegacyQueryString() {
            try {
                var params = new URLSearchParams(window.location.search);
                var legacy = params.get('page');
                if (!legacy) return;
                var cleanPath = pageToPathname(legacy);
                params.delete('page');
                var tail = params.toString();
                var newUrl = cleanPath + (tail ? ('?' + tail) : '');
                window.history.replaceState({ page: legacy }, '', newUrl);
            } catch (e) { /* ignore */ }
        })();

        const iframeUrl = buildIframeUrl();
        iframe.src = iframeUrl;

        // ------------------------------------------------------------
        // ORIGIN TRUST + READY STATE
        // ------------------------------------------------------------
        function isTrustedOrigin(origin) {
            if (!origin || origin === 'null') return true;
            return origin === 'https://script.google.com' ||
                   origin === 'https://script.googleusercontent.com' ||
                   origin.indexOf('.googleusercontent.com') !== -1 ||
                   origin.indexOf('.google.com') !== -1;
        }

        let iframeReady = false;
        let pendingPage = null;
        let lastEarlyBroadcast = null;

        function relayToIframe(msg) {
            function relay(win, depth) {
                if (!win || depth > 6) return;
                try { win.postMessage(msg, '*'); } catch (e) {}
                try {
                    for (var i = 0; i < win.frames.length; i++) {
                        relay(win.frames[i], depth + 1);
                    }
                } catch (e) {}
            }
            relay(iframe.contentWindow, 0);
        }

        // ------------------------------------------------------------
        // MESSAGES FROM GAS
        // ------------------------------------------------------------
        window.addEventListener('message', function (event) {
            if (event.source === window) return;
            if (!isTrustedOrigin(event.origin)) return;

            var data = event.data;
            if (!data || !data.type) return;

            // New canonical navigate message
            if (data.type === 'projectfinder:navigate') {
                var page = (data.page || 'home').toString();
                var newPath = pageToPathname(page);
                var url = new URL(window.location.href);
                url.pathname = newPath;
                url.searchParams.delete('page');
                var target = url.pathname + (url.search || '') + url.hash;
                if (target !== (window.location.pathname + window.location.search + window.location.hash)) {
                    if (data.replace) {
                        window.history.replaceState({ page: page }, '', target);
                    } else {
                        window.history.pushState({ page: page }, '', target);
                    }
                }
                if (data.title) document.title = data.title;
                
                // If we update the URL before the iframe is ready,
                // update pendingPage so the ready handshake uses this new state
                // instead of reverting to the original URL.
                if (!iframeReady) {
                    pendingPage = page;
                    lastEarlyBroadcast = null; // Clear this to prevent double-firing
                }
                return;
            }

            // Legacy messages kept working (backward compat with old GAS code)
            if (data.type === 'navigate') {
                if (data.url && data.url !== window.location.pathname) {
                    window.history.pushState(null, '', data.url);
                }
                return;
            }
            if (data.type === 'setTitle') {
                if (data.title) document.title = data.title;
                return;
            }

            if (data.type === 'projectfinder:ready' || data.type === 'ready') {
                iframeReady = true;

                var initial = pendingPage !== null
                    ? pendingPage
                    : pathnameToPage(window.location.pathname);
                pendingPage = null;
                
                // Tell the iframe what its final state should be
                relayToIframe({ type: 'projectfinder:popstate', page: initial });
                return;
            }
        });

        // ------------------------------------------------------------
        // BROWSER BACK / FORWARD
        // ------------------------------------------------------------
        window.addEventListener('popstate', function () {
            var page = pathnameToPage(window.location.pathname);
            if (!iframeReady) {
                pendingPage = page;
                return;
            }
            relayToIframe({ type: 'projectfinder:popstate', page: page });
        });

        // ------------------------------------------------------------
        // IFRAME LOAD / ERROR
        // ------------------------------------------------------------
        function hideError() { errorMessage.classList.remove('show'); }
        closeErrorModal.addEventListener('click', hideError);
        window.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && errorMessage.classList.contains('show')) {
                hideError();
            }
        });

        function showError(message) {
            if (hasLoaded) return;
            clearTimeout(loadTimeout);
            loadingContainer.classList.add('hidden');
            errorText.textContent = message || 'Unable to load the application. Please check your internet connection and try again.';
            errorMessage.classList.add('show');
        }

        function onIframeLoad() {
            if (hasLoaded) return;
            clearTimeout(loadTimeout);
            hasLoaded = true;
            loadingContainer.classList.add('hidden');
            setTimeout(function () {
                loadingContainer.style.display = 'none';
            }, 300);
        }

        function onIframeError() {
            if (hasLoaded) return;
            showError('Failed to load the application. The Google Apps Script web app might be unavailable or the URL is incorrect.');
        }

        iframe.addEventListener('load', onIframeLoad);
        iframe.addEventListener('error', onIframeError);

        loadTimeout = setTimeout(function () {
            if (!hasLoaded) {
                showError('Loading timeout. The application is taking too long to respond. Please try again.');
            }
        }, 15000);

        console.log('Project Finder wrapper loaded. Iframe URL:', iframeUrl);
    </script>
</body>
</html>
