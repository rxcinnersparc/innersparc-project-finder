<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    
    <!-- Title - will be overridden by Apps Script -->
    <title>Loading...</title>
    
    <!-- Favicon - will be dynamically updated -->
    <link rel="icon" type="image/png" href="" id="favicon">
    <link rel="shortcut icon" type="image/png" href="" id="favicon-shortcut">
    <link rel="apple-touch-icon" href="" id="apple-touch-icon">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f5fb;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Minimal loading state */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f4f5fb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        
        .loading-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #dde0f0;
            border-top-color: #222689;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #gas-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #gas-iframe.visible {
            opacity: 1;
        }
        
        /* Error message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 1px solid #f5c2c2;
            display: none;
            z-index: 10001;
        }
        
        .error-message.show {
            display: block;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error-title {
            font-size: 1rem;
            font-weight: 800;
            color: #c0392b;
            margin-bottom: 8px;
        }
        
        .error-text {
            font-size: 0.75rem;
            color: #7b7fa8;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .error-button {
            background: #222689;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
        }
        
        .error-button:hover {
            background: #1a1d6e;
        }
    </style>
</head>
<body>    
    <!-- Minimal loading indicator -->
    <div class="loading-container" id="loadingContainer">
        <div class="loading-spinner"></div>
    </div>
    
    <div class="error-message" id="errorMessage">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-text" id="errorText">
            Unable to load the application. Please check your internet connection and try again.
        </div>
        <button class="error-button" onclick="location.reload()">Retry</button>
    </div>
    
    <iframe id="gas-iframe" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe>

    <script>
        // ⚠️ IMPORTANT: Replace this with your actual Google Apps Script Web App URL
        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzAOnAB1ZKUQ2YJ8vHjl0pM5sYG_XHXg6ZCHpMNinGRbGRaKARzmbhVU-bXzLQGOcL2iw/exec';
        
        const iframe = document.getElementById('gas-iframe');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const loadingContainer = document.getElementById('loadingContainer');
        
        let hasLoaded = false;
        let loadTimeout;
        let configData = null;
        
        // ============================================================
        // FETCH CONFIG FROM GOOGLE SHEETS
        // ============================================================
        async function fetchConfig() {
            try {
                const response = await fetch(GAS_WEBAPP_URL + '?action=config');
                if (!response.ok) throw new Error('Failed to fetch config');
                const config = await response.json();
                
                if (config && !config.error) {
                    configData = config;
                    applyConfig(config);
                    return config;
                } else {
                    console.warn('Config error:', config?.error);
                    return null;
                }
            } catch (error) {
                console.warn('Could not fetch config:', error);
                return null;
            }
        }
        
        // ============================================================
        // APPLY CONFIG TO PAGE
        // ============================================================
        function applyConfig(config) {
            // Update title
            if (config.COMPANY_NAME && config.WEB_APP_NAME) {
                document.title = config.COMPANY_NAME + ' — ' + config.WEB_APP_NAME;
            } else if (config.COMPANY_NAME) {
                document.title = config.COMPANY_NAME;
            }
            
            // Update favicon - get first URL from comma-separated list
            if (config.LOGO_URL) {
                const logoUrls = config.LOGO_URL.split(',').map(u => u.trim()).filter(u => u.length > 0);
                if (logoUrls.length > 0) {
                    const faviconUrl = logoUrls[0];
                    
                    // Update all favicon links
                    document.getElementById('favicon').href = faviconUrl;
                    document.getElementById('favicon-shortcut').href = faviconUrl;
                    document.getElementById('apple-touch-icon').href = faviconUrl;
                }
            }
        }
        
        // ============================================================
        // IFRAME LOADING
        // ============================================================
        function showError(message) {
            if (hasLoaded) return;
            
            clearTimeout(loadTimeout);
            loadingContainer.classList.add('hidden');
            errorText.textContent = message || 'Unable to load the application. Please check your internet connection and try again.';
            errorMessage.classList.add('show');
        }
        
        function onIframeLoad() {
            if (hasLoaded) return;
            
            clearTimeout(loadTimeout);
            hasLoaded = true;
            
            // Hide loading, show iframe
            loadingContainer.classList.add('hidden');
            iframe.classList.add('visible');
            
            setTimeout(() => {
                loadingContainer.style.display = 'none';
            }, 300);
        }
        
        function onIframeError() {
            if (hasLoaded) return;
            showError('Failed to load the application. The Google Apps Script web app might be unavailable or the URL is incorrect.');
        }
        
        function buildIframeUrl() {
            let url = GAS_WEBAPP_URL;
            
            const params = new URLSearchParams(window.location.search);
            const hash = window.location.hash;
            
            if (params.toString()) {
                url += '?' + params.toString();
            }
            
            if (hash) {
                url += (params.toString() ? '&' : '?') + 'hash=' + encodeURIComponent(hash.substring(1));
            }
            
            return url;
        }
        
        // ============================================================
        // INITIALIZE
        // ============================================================
        async function init() {
            // 1. Fetch config from Google Sheets
            await fetchConfig();
            
            // 2. Set iframe URL
            const iframeUrl = buildIframeUrl();
            iframe.src = iframeUrl;
            
            // 3. Set timeout for loading (15 seconds max)
            loadTimeout = setTimeout(() => {
                if (!hasLoaded) {
                    showError('Loading timeout. The application is taking too long to respond. Please try again.');
                }
            }, 15000);
            
            // 4. Attach iframe event listeners
            iframe.addEventListener('load', onIframeLoad);
            iframe.addEventListener('error', onIframeError);
            
            console.log('GitHub Pages wrapper loaded. Iframe URL:', iframeUrl);
            if (configData) {
                console.log('Config loaded:', configData.COMPANY_NAME, configData.WEB_APP_NAME);
            }
        }
        
        // ============================================================
        // POSTMESSAGE HANDLING
        // ============================================================
        window.addEventListener('message', function(event) {
            if (event.origin !== 'https://script.google.com') return;
            
            if (event.data && event.data.type) {
                switch(event.data.type) {
                    case 'navigate':
                        if (event.data.url && event.data.url !== window.location.pathname) {
                            history.pushState(null, '', event.data.url);
                        }
                        break;
                    case 'setTitle':
                        if (event.data.title) {
                            document.title = event.data.title;
                        }
                        break;
                    case 'ready':
                        console.log('Apps Script app is ready');
                        break;
                }
            }
        });
        
        // ============================================================
        // BROWSER NAVIGATION
        // ============================================================
        window.addEventListener('popstate', function() {
            iframe.contentWindow.postMessage({
                type: 'popstate',
                url: window.location.href
            }, '*');
        });
        
        // ============================================================
        // START
        // ============================================================
        init();
    </script>
</body>
</html>
